packages:
  - packages/*

catalogMode: strict

# Vite's optional TypeScript config loader is unnecessary with native Node execution.
overrides:
  protobufjs: 7.6.6
  'vite>tsx': '-'

catalog:
  '@earendil-works/pi-agent-core': 1.4.0
  '@earendil-works/pi-ai': 1.4.0
  '@earendil-works/pi-coding-agent': 1.4.0
  '@earendil-works/pi-tui': 1.4.0
  '@earendil-works/pi-mcp': 1.4.0
  '@fastify/cors': 11.3.1
  '@fastify/multipart': 10.1.4
  '@modelcontextprotocol/sdk': 1.32.1
  '@napi-rs/keyring': 1.3.0
  '@wecom/aibot-node-sdk': 1.0.7
  '@types/node': 26.6.5
  croner: 10.0.1
  esbuild: 0.28.2
  fastify: 5.12.7
  marked: 18.0.11
  picocolors: 1.1.1
  proper-lockfile: 4.1.2
  typebox: 1.3.27
  typescript: 7.0.2
  vitest: 4.1.11
  yaml: 2.9.0
  zod: 4.6.7
  qrcode: 1.5.4
  '@types/qrcode': 1.5.6

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true

# Keep the already-pinned pi release installable during the one-day age window.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.4.0'
  - '@earendil-works/pi-ai@1.4.0'
  - '@earendil-works/pi-codemode@1.4.0'
  - '@earendil-works/pi-coding-agent@1.4.0'
  - '@earendil-works/pi-mcp@1.4.0'
  - '@earendil-works/pi-telemetry@1.4.0'
  - '@earendil-works/pi-tui@1.4.0'
