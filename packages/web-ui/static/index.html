<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Code</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>DeepSeek Code</h1>
    <span id="actions">
      <button id="upload" class="header-button" hidden>Upload</button>
      <button id="stop" class="header-button" hidden>Stop</button>
      <input id="file-input" type="file" multiple hidden>
    </span>
  </header>
  <div id="terminal">
    <pre><code class="termino-console"></code></pre>
    <textarea class="termino-input" rows="1" wrap="hard" spellcheck="false"></textarea>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
