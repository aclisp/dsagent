# DSCode chat server — compose equivalent of the docker run in packages/web-ui/README.md.
#
# Requires a .env next to this file with DSCODE_INSTANCE_NAME, DSCODE_HOST_PORT,
# WORKSPACE_ID, TZ, OPENROUTER_API_KEY, MODEL, and VISION_MODEL. Build the image first:
#   DOCKER_DEFAULT_PLATFORM=linux/amd64 docker build -t dscode-server:lean .   # lean base
#   docker build -f deploy/tools.Dockerfile -t dscode-server .                # derived tool image
# Then:
#   docker compose up -d        # create/update; recreates the container after an image rebuild
#   docker compose down         # stop/remove the container; bind-mounted data is kept
#
name: "${DSCODE_INSTANCE_NAME:?set DSCODE_INSTANCE_NAME in .env}"

# HOST/PORT inside the container come from image defaults (0.0.0.0:8899).
services:
  dscode:
    image: ${DSCODE_IMAGE:-dscode-server}
    container_name: "${DSCODE_INSTANCE_NAME}"
    restart: unless-stopped
    init: true
    ports:
      - "${DSCODE_HOST_PORT:?set DSCODE_HOST_PORT in .env}:8899"
    environment:
      # The workspace id is the deployment's bearer credential — high-entropy, shared only out-of-band.
      WORKSPACES: "${WORKSPACE_ID:?set WORKSPACE_ID in .env}=/workspace"
      TZ: "${TZ:?set TZ to an IANA timezone in .env}"
      RUNTIME_ARGS: >-
        --permission full --network --sandbox danger-full-access
        --provider openrouter --model ${MODEL:?set MODEL in .env}
        --effort max --tools exec_command,write_stdin,apply_patch,read
      DSCODE_SUBAGENT_DEPTH: "1"
      DSCODE_VISION_MODEL: "${VISION_MODEL:?set VISION_MODEL in .env}"
      CHAT_AGENT_NAME: "${CHAT_AGENT_NAME:-Steve Code}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}"
    volumes:
      - type: bind
        source: ../home
        target: /root/.dscode
        bind:
          create_host_path: false
      - type: bind
        source: ../home-config
        target: /root/.config
        bind:
          create_host_path: false
      - type: bind
        source: ../workspace
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ../models.json
        target: /root/.dscode/models.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "../prompt-profiles/${DSCODE_PROMPT_PROFILE:-steve}/SYSTEM.md"
        target: /root/.dscode/SYSTEM.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "../prompt-profiles/${DSCODE_PROMPT_PROFILE:-steve}/favicon.png"
        target: /app/packages/web-ui/static/favicon.png
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../default-files/APPEND_SYSTEM.md
        target: /root/.dscode/APPEND_SYSTEM.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../default-files/AGENTS.md
        target: /root/.dscode/AGENTS.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../locked-workspace-pi
        target: /workspace/.pi
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../bin/youxin-cli.linux-x64
        target: /usr/local/bin/youxin-cli
        read_only: true
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
