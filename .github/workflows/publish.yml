name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DSCODE_SANDBOX_IMAGE: node:24-bookworm-slim
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release source and version
        id: metadata
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.2
          run_install: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check for an existing npm version
        id: registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
        run: |
          npm_error="$RUNNER_TEMP/npm-view-error.log"
          if published_version="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>"$npm_error")"; then
            test "$published_version" = "$PACKAGE_VERSION"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already on npm; skipping duplicate publication."
            exit 0
          fi
          if ! grep -q "E404" "$npm_error"; then
            cat "$npm_error" >&2
            exit 1
          fi
          echo "already_published=false" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.registry.outputs.already_published != 'true'
        run: pnpm install --frozen-lockfile

      - name: Prepare Linux sandbox image
        if: steps.registry.outputs.already_published != 'true'
        run: docker pull "$DSCODE_SANDBOX_IMAGE"

      - name: Validate release
        if: steps.registry.outputs.already_published != 'true'
        run: pnpm check

      - name: Pack the exact release artifact
        if: steps.registry.outputs.already_published != 'true'
        run: |
          mkdir -p package-artifacts
          npm pack --pack-destination package-artifacts

      - name: Upload package artifact
        if: steps.registry.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.ref_name }}
          path: package-artifacts/*.tgz
          if-no-files-found: error

      - name: Publish to npm
        if: steps.registry.outputs.already_published != 'true'
        run: npm publish package-artifacts/*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
