name: Create GitHub release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.result.outputs.ready }}
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.state.outputs.release_sha }}
    steps:
      - name: Check out the validated main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Confirm this is still the latest main commit
        id: source
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$main_sha" != "$RELEASE_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Skipping stale main commit $RELEASE_SHA; current main is $main_sha."
            exit 0
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"

      - name: Confirm this is a versioned main commit
        id: version
        if: steps.source.outputs.stale != 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_version="$(node -p "require('./package.json').version")"
          previous_version="$(git show "${RELEASE_SHA}^1:package.json" | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")"
          if [ "$current_version" = "$previous_version" ]; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            echo "Skipping non-versioned main commit $RELEASE_SHA ($current_version)."
            exit 0
          fi
          echo "versioned=true" >> "$GITHUB_OUTPUT"

      - name: Read package release metadata
        id: metadata
        if: steps.source.outputs.stale != 'true' && steps.version.outputs.versioned == 'true'
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          echo "tag=v$package_version" >> "$GITHUB_OUTPUT"

      - name: Inspect the release tag
        id: state
        if: steps.source.outputs.stale != 'true' && steps.version.outputs.versioned == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            git merge-base --is-ancestor "$tag_sha" origin/main
            echo "mode=existing_release" >> "$GITHUB_OUTPUT"
            echo "release_sha=$tag_sha" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG already has a GitHub Release; use workflow_dispatch for an image retry."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$tag_sha" != "$RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG points to $tag_sha instead of $RELEASE_SHA."
              exit 1
            fi
            echo "mode=existing_tag" >> "$GITHUB_OUTPUT"
            echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=create_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create a release from the existing tag
        if: steps.state.outputs.mode == 'existing_tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes

      - name: Create the tag and GitHub Release
        if: steps.state.outputs.mode == 'create_tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes

      - name: Mark the release ready for image publication
        id: result
        if: >-
          steps.source.outputs.stale != 'true' &&
          steps.version.outputs.versioned == 'true' &&
          steps.state.outputs.mode != 'existing_release'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: needs.release.outputs.ready == 'true'
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      sha: ${{ needs.release.outputs.sha }}
