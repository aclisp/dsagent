name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DSCODE_SANDBOX_IMAGE: node:26-trixie-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Set up Go for Windows sandbox packaging
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Validate release version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        run: |
          git fetch origin "$GITHUB_BASE_REF"
          base_package="$RUNNER_TEMP/base-package.json"
          git show "origin/$GITHUB_BASE_REF:package.json" > "$base_package"
          base_version="$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync(process.argv[1], 'utf8')).version)" "$base_package")"
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_private="$(node -p "require('./package.json').private")"
          core_package_name="$(node -p "require('./packages/core/package.json').name")"
          core_package_version="$(node -p "require('./packages/core/package.json').version")"
          core_package_private="$(node -p "require('./packages/core/package.json').private")"
          if [ "$package_private" != "true" ] || [ "$core_package_private" != "true" ]; then
            echo "::error::The root and Core npm packages must remain private while npm distribution is paused."
            exit 1
          fi
          if [ "$core_package_version" != "$package_version" ]; then
            echo "::error::$core_package_name@$core_package_version must match $package_name@$package_version."
            exit 1
          fi
          if [ "$package_version" = "$base_version" ]; then
            release_source_changes="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -Ev '^(\.github/|docs/)' || true)"
            if [ -n "$release_source_changes" ]; then
              echo "::error::Bump package.json version before merging a release to main."
              printf '%s\n' "$release_source_changes"
              exit 1
            fi
            echo "Workflow/documentation-only change; keeping $package_name@$package_version."
            exit 0
          fi
          echo "Verified private packages $package_name@$package_version and $core_package_name@$core_package_version."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Linux sandbox image
        run: docker pull "$DSCODE_SANDBOX_IMAGE"

      - name: Typecheck, test, and build
        run: pnpm check

  standalone-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python for ConPTY acceptance
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --only-binary=:all: -r standalone/test/requirements-windows.txt

      - name: Validate bundled-tool installation and upgrades
        run: node --test standalone/test/tools-install.test.mjs

      - name: Build standalone executable
        run: pnpm build:standalone --target windows-x64

      - name: Validate Windows managed-child commands
        run: pnpm exec vitest run test/literal-command.test.ts test/dscode-command.test.ts test/vision-command.test.ts test/command-permissions.test.ts test/windows-child-process.test.ts

      - name: Validate relocated Windows executable
        env:
          DSCODE_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node standalone/test/verify.mjs dist/standalone/windows-x64

      - name: Preserve Windows acceptance results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: standalone-windows-x64
          path: dist/standalone/windows-x64
          if-no-files-found: ignore
          retention-days: 7
